name: Import supplied W&B diagrams

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main

jobs:
  import-diagrams:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Import the supplied diagrams
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            https://github.com/user-attachments/assets/97eb417f-cd69-41db-ba78-7ad2503381b0 \
            --output /tmp/wandb-workflow-overview-en.png
          curl --fail --location --retry 3 \
            https://github.com/user-attachments/assets/30906c5b-d7eb-400c-ab07-e2773fa1c7e5 \
            --output /tmp/wandb-workflow-overview-ja.png

          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path

          from PIL import Image

          showcase = Path("examples/wandb_showcase")
          diagrams = (
              (
                  Path("/tmp/wandb-workflow-overview-en.png"),
                  showcase / "assets" / "wandb-workflow-overview-en.jpg",
                  (1536, 1024),
              ),
              (
                  Path("/tmp/wandb-workflow-overview-ja.png"),
                  showcase / "assets" / "wandb-workflow-overview-ja.jpg",
                  (1448, 1086),
              ),
          )
          for source, destination, expected_dimensions in diagrams:
              with Image.open(source) as image:
                  assert image.size == expected_dimensions, source
                  rgba = image.convert("RGBA")
                  background = Image.new("RGB", rgba.size, "white")
                  background.paste(rgba, mask=rgba.getchannel("A"))
                  background.save(destination, "JPEG", quality=90, optimize=True, progressive=True)

              data = destination.read_bytes()
              assert data.startswith(b"\xff\xd8\xff"), destination
              assert data.endswith(b"\xff\xd9"), destination
              assert 5_000 < destination.stat().st_size <= 1024 * 1024, destination
              with Image.open(destination) as converted:
                  assert converted.size == expected_dimensions, destination

          replacements = {
              showcase / "README.md": (
                  "./assets/wandb-workflow-overview-en.svg",
                  "./assets/wandb-workflow-overview-en.jpg",
              ),
              showcase / "README.ja.md": (
                  "./assets/wandb-workflow-overview-ja.svg",
                  "./assets/wandb-workflow-overview-ja.jpg",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              assert old in text, path
              path.write_text(text.replace(old, new))

          test_path = Path("tests/integrations/wandb_artifacts/test_showcase_localization.py")
          test = test_path.read_text()
          test = test.replace("wandb-workflow-overview-en.svg", "wandb-workflow-overview-en.jpg")
          test = test.replace("wandb-workflow-overview-ja.svg", "wandb-workflow-overview-ja.jpg")
          start = test.index("    for diagram in (ENGLISH_DIAGRAM, JAPANESE_DIAGRAM):")
          end = test.index("\n\n\ndef test_localized_manual_uses_the_same_commands_as_english", start)
          replacement = '''    for diagram in (ENGLISH_DIAGRAM, JAPANESE_DIAGRAM):
              data = diagram.read_bytes()
              assert data.startswith(b"\\xff\\xd8\\xff")
              assert data.endswith(b"\\xff\\xd9")
              assert 5_000 < diagram.stat().st_size <= 1024 * 1024
          '''
          test_path.write_text(test[:start] + replacement + test[end:])
          PY

          assets=examples/wandb_showcase/assets
          rm "$assets/wandb-workflow-overview-en.svg"
          rm "$assets/wandb-workflow-overview-ja.svg"
          rm .github/workflows/import-wandb-diagrams.yml

          python - <<'PY'
          import runpy

          tests = runpy.run_path("tests/integrations/wandb_artifacts/test_showcase_localization.py")
          tests["test_manuals_link_to_each_other_and_render_local_diagrams"]()
          tests["test_localized_manual_uses_the_same_commands_as_english"]()
          tests["test_japanese_manual_keeps_product_and_runtime_terms_in_english"]()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: use supplied W&B workflow diagrams'
          git push