# Proves the `lerobot-wandb` companion distribution coexists with an installed
# LeRobot distribution: installing the wheel never replaces or modifies LeRobot,
# and uninstalling either distribution never deletes the other's files.
name: Wandb Companion Coexistence

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "packages/lerobot-wandb/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/wandb_coexistence.yml"
  push:
    branches:
      - main
    paths:
      - "packages/lerobot-wandb/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/wandb_coexistence.yml"

permissions:
  contents: read

jobs:
  coexistence:
    name: Coexistence Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@0c5bedb9f63b4e9198997c5d23c7bc7c39d3b0e8  # v5.0.2
        with:
          version: "0.8.0"

      # The smoke script's environment B runs the fork development flow (`uv run ...`),
      # which needs the fork's dev environment synced first.
      - name: Sync fork development environment
        run: uv sync --locked --extra dataset --extra training --extra test

      - name: Run coexistence smoke
        run: bash packages/lerobot-wandb/scripts/coexistence_smoke.sh
