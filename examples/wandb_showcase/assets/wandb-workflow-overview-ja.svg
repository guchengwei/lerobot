<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">W&amp;B-native LeRobot workflow 日本語版</title>
  <desc id="desc">teleoperation によるデータ収集、W&amp;B Artifact への upload、GPU training、結果記録、model promotion、robot deployment の流れ。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Arial, sans-serif; fill: #172033; }
      .title { font-size: 21px; font-weight: 700; }
      .step { font-size: 18px; font-weight: 700; }
      .head { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .panel { fill: #fff; stroke-width: 1.5; rx: 14; }
      .blue { stroke: #6c8fe8; }
      .green { stroke: #62ad79; }
      .purple { stroke: #9b7bd8; }
      .gold { stroke: #e6a721; }
      .inner { fill: #fbfcff; stroke: #c9d3e8; stroke-width: 1.1; rx: 10; }
      .arrow { fill: none; stroke: #172033; stroke-width: 2.2; marker-end: url(#arrow); }
      .manage { fill: none; stroke: #7252c7; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#172033"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7252c7"/></marker>
  </defs>
  <rect width="1500" height="940" fill="#ffffff"/>

  <g><circle cx="42" cy="35" r="17" fill="#4774cf"/><text x="42" y="41" text-anchor="middle" fill="#fff" class="step">1</text><text x="70" y="42" class="step" fill="#234da0">遠隔操作とデータ収集</text></g>
  <g><circle cx="505" cy="35" r="17" fill="#4774cf"/><text x="505" y="41" text-anchor="middle" fill="#fff" class="step">2</text><text x="533" y="42" class="step" fill="#234da0">W&amp;B へ upload</text></g>
  <g><circle cx="985" cy="35" r="17" fill="#299353"/><text x="985" y="41" text-anchor="middle" fill="#fff" class="step">3</text><text x="1013" y="42" class="step" fill="#197841">training 用に download</text></g>
  <g><circle cx="1240" cy="35" r="17" fill="#299353"/><text x="1240" y="41" text-anchor="middle" fill="#fff" class="step">4</text><text x="1268" y="42" class="step" fill="#197841">GPU Server で training</text></g>

  <rect x="18" y="65" width="350" height="440" class="panel blue"/>
  <rect x="32" y="82" width="322" height="210" class="inner"/>
  <text x="193" y="108" text-anchor="middle" class="head">SO-ARM / LeRobot teleoperation</text>
  <rect x="55" y="126" width="276" height="76" rx="10" fill="#eef2f8" stroke="#aebbd2"/>
  <path d="M120 188 l20-38 25 13 22-25 20 12 22-24" fill="none" stroke="#545d6e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="188" r="11" fill="#343b47"/><circle cx="229" cy="126" r="9" fill="#343b47"/>
  <text x="78" y="231" class="body">Multi-view Camera</text><text x="78" y="251" class="small">動画 stream</text>
  <text x="190" y="231" class="body">Robot State</text><text x="190" y="251" class="small">joint / gripper</text>
  <text x="286" y="231" class="body">Action</text><text x="286" y="251" class="small">teleoperation 入力</text>
  <path d="M193 292 V318" class="arrow"/>
  <rect x="32" y="320" width="322" height="165" class="inner"/>
  <text x="193" y="347" text-anchor="middle" class="head">local recording (LeRobot)</text>
  <rect x="55" y="370" width="92" height="55" fill="#fff" stroke="#9eabc1"/><text x="101" y="399" text-anchor="middle" class="body">MP4</text>
  <rect x="160" y="370" width="78" height="55" fill="#fff" stroke="#9eabc1"/><path d="M160 387 H238 M160 404 H238 M186 370 V425 M212 370 V425" stroke="#9eabc1"/><text x="199" y="445" text-anchor="middle" class="small">Parquet</text>
  <text x="276" y="405" class="title">{ }</text><text x="276" y="445" text-anchor="middle" class="small">JSON metadata</text>
  <text x="193" y="472" text-anchor="middle" class="body">local disk 上の LeRobotDataset</text>

  <rect x="460" y="65" width="500" height="640" class="panel gold" fill="#fffdf8"/>
  <text x="710" y="100" text-anchor="middle" class="title">W&amp;B Backend</text>
  <text x="710" y="132" text-anchor="middle" font-size="34" font-weight="700">W&amp;B</text>
  <rect x="478" y="155" width="225" height="176" class="inner"/>
  <text x="590" y="184" text-anchor="middle" class="head" fill="#59216b">Artifacts（データ保存）</text>
  <ellipse cx="515" cy="220" rx="23" ry="9" fill="#dce6ff" stroke="#4d73ce"/><path d="M492 220 v30 c0 12 46 12 46 0 v-30" fill="#dce6ff" stroke="#4d73ce"/><ellipse cx="515" cy="250" rx="23" ry="9" fill="none" stroke="#4d73ce"/>
  <text x="555" y="220" class="body">raw episode</text><text x="555" y="240" class="small">video / parquet / JSON</text>
  <text x="515" y="294" text-anchor="middle" class="body">processed dataset / stats / split</text>
  <rect x="717" y="155" width="225" height="176" class="inner"/>
  <text x="830" y="184" text-anchor="middle" class="head" fill="#59216b">Metadata &amp; Index</text>
  <text x="742" y="219" class="body">▣ episode 情報</text><text x="742" y="247" class="body">⚙ robot / camera config</text><text x="742" y="275" class="body">◆ task / tag</text><text x="742" y="303" class="body">◷ checksum / version</text>
  <rect x="478" y="348" width="464" height="158" class="inner"/>
  <text x="710" y="378" text-anchor="middle" class="head">Runs（実験管理と tracking）</text>
  <polyline points="505,460 530,430 555,445 580,408 605,420 632,395" fill="none" stroke="#6577ed" stroke-width="3"/>
  <polyline points="660,456 690,438 720,444 750,405 782,421" fill="none" stroke="#4a8adf" stroke-width="3"/>
  <rect x="815" y="414" width="14" height="44" fill="#668bd7"/><rect x="838" y="430" width="14" height="28" fill="#668bd7"/><rect x="861" y="398" width="14" height="60" fill="#668bd7"/>
  <text x="566" y="486" text-anchor="middle" class="small">training metrics</text><text x="720" y="486" text-anchor="middle" class="small">evaluation Run</text><text x="845" y="486" text-anchor="middle" class="small">system metrics</text>
  <rect x="478" y="525" width="464" height="160" class="inner"/>
  <text x="710" y="555" text-anchor="middle" class="head">Model Registry（Artifacts）</text>
  <g fill="#ecf8ed" stroke="#5ca96a"><path d="M560 590 l22-12 22 12 v27 l-22 13-22-13z"/><path d="M675 590 l22-12 22 12 v27 l-22 13-22-13z"/><path d="M790 590 l22-12 22 12 v27 l-22 13-22-13z"/></g>
  <text x="582" y="650" text-anchor="middle" class="body">policy_v1</text><text x="697" y="650" text-anchor="middle" class="body">policy_v2</text><text x="812" y="650" text-anchor="middle" class="body">policy_v3</text>
  <text x="710" y="674" text-anchor="middle" class="small">lineage / immutable version / alias / metadata</text>

  <path d="M368 225 H450" class="arrow"/><text x="409" y="207" text-anchor="middle" class="body" fill="#315cc0">upload</text><text x="409" y="244" text-anchor="middle" class="small">lerobot-wandb</text>
  <path d="M960 225 H1190" class="arrow"/><text x="1075" y="207" text-anchor="middle" class="body" fill="#197841">download</text><text x="1075" y="244" text-anchor="middle" class="small">local disk に materialize</text>

  <rect x="1198" y="65" width="282" height="394" class="panel green"/>
  <rect x="1215" y="88" width="248" height="92" class="inner"/><text x="1339" y="116" text-anchor="middle" class="head">GPU Server / Cloud</text><text x="1260" y="154" font-size="27">▣</text><text x="1327" y="154" font-size="27">▣</text><text x="1394" y="154" font-size="27">▣</text>
  <rect x="1215" y="198" width="248" height="240" class="inner"/><text x="1339" y="226" text-anchor="middle" class="head" fill="#197841">LeRobot training pipeline</text>
  <g fill="#fff" stroke="#bdc7d9"><rect x="1245" y="248" width="188" height="36"/><rect x="1245" y="302" width="188" height="36"/><rect x="1245" y="356" width="188" height="36"/></g>
  <text x="1339" y="271" text-anchor="middle" class="body">Artifact dataset を load</text><text x="1339" y="325" text-anchor="middle" class="body">preprocess &amp; training</text><text x="1339" y="379" text-anchor="middle" class="body">validation / evaluation</text>
  <path d="M1339 284 V299 M1339 338 V353" class="arrow"/>

  <path d="M1339 459 V485" class="arrow"/>
  <rect x="1115" y="488" width="365" height="217" class="panel purple"/>
  <g><circle cx="1144" cy="518" r="15" fill="#7859c8"/><text x="1144" y="524" text-anchor="middle" fill="#fff" class="body">5</text><text x="1170" y="525" class="step" fill="#6544b2">結果を W&amp;B に記録</text></g>
  <text x="1145" y="563" class="body">⌁ Metrics：loss / accuracy / success rate</text><text x="1145" y="600" class="body">▧ Logs：chart / image / video</text><text x="1145" y="637" class="body">▤ rollout / evaluation video</text><text x="1145" y="674" class="body">▰ final / periodic checkpoint</text>
  <path d="M1115 610 H970" class="arrow"/><text x="1042" y="592" text-anchor="middle" class="body" fill="#6544b2">final model を publish</text>

  <rect x="18" y="535" width="350" height="247" class="panel purple"/>
  <g><circle cx="48" cy="565" r="15" fill="#7859c8"/><text x="48" y="571" text-anchor="middle" fill="#fff" class="body">6</text><text x="75" y="572" class="step" fill="#6544b2">model の version 管理と運用</text></g>
  <text x="48" y="615" class="body">⬡ Model Registry：version / alias / lineage</text><text x="48" y="654" class="body">⚖ Run 比較：metrics / config</text><text x="48" y="693" class="body">★ 評価した immutable version を promote</text><text x="48" y="732" class="body">◷ 再現性：data + code + config</text>
  <path d="M460 625 H377" class="manage"/>

  <rect x="395" y="735" width="680" height="172" class="panel blue"/>
  <g><circle cx="425" cy="765" r="15" fill="#4774cf"/><text x="425" y="771" text-anchor="middle" fill="#fff" class="body">7</text><text x="452" y="772" class="step" fill="#234da0">deploy / inference</text></g>
  <rect x="420" y="790" width="190" height="95" class="inner"/><text x="515" y="820" text-anchor="middle" class="head">policy を download</text><text x="515" y="848" text-anchor="middle" class="body">immutable Artifact ref</text><text x="515" y="870" text-anchor="middle" class="small">local policy directory</text>
  <rect x="640" y="790" width="190" height="95" class="inner"/><text x="735" y="820" text-anchor="middle" class="head">deploy 先</text><text x="735" y="850" text-anchor="middle" class="body">robot / edge / local</text>
  <rect x="860" y="790" width="190" height="95" class="inner"/><text x="955" y="820" text-anchor="middle" class="head">inference 実行</text><text x="955" y="850" text-anchor="middle" class="body">closed-loop control</text><text x="955" y="872" text-anchor="middle" class="small">control loop 内で W&amp;B 通信なし</text>
  <path d="M610 838 H635 M830 838 H855" class="arrow"/><path d="M190 782 V838 H390" class="manage"/>

  <rect x="1115" y="735" width="365" height="172" class="inner"/>
  <text x="1138" y="769" class="head">運用上の boundary</text><text x="1138" y="806" class="body">✓ completed dataset / policy を W&amp;B に保存</text><text x="1138" y="838" class="body">✓ local disk は runtime cache / buffer</text><text x="1138" y="870" class="body">✓ alias は動くが immutable version は動かない</text>
  <text x="750" y="930" text-anchor="middle" class="small">概念図です。実装済み workflow の正確な interface は manual 内の CLI command を参照してください。</text>
</svg>
